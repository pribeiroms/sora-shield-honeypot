honeypot:
  ports: [21, 23, 3389]                  # portas isca: FTP, Telnet, RDP
  bind_address: "0.0.0.0"
  connection_timeout_seconds: 10         # tempo máximo de uma conexão aberta

capture:
  interface: "eth0"                      # interface de rede monitorada
  save_pcap: false

firewall:
  enabled: false                         # deixem false até testar em ambiente controlado
  max_attempts: 5                        # limite de tentativas antes do bloqueio
  block_duration_minutes: 60
  whitelist: ["127.0.0.1"]

logging:
  file: "logs/events.log"
